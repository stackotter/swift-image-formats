name: Test macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2" # Swift 6.2

      - name: Swift version
        run: swift --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test arm64
        run: swift test --arch arm64

      - name: Build x86_64 # SwiftPM doesn't like running cross compiled tests
        run: swift build --arch x86_64
