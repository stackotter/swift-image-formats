name: Test Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Setup
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test
